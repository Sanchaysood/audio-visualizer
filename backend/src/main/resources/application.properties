# Spring Boot Application Configuration

# Server Configuration
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain

# Application Name
spring.application.name=streaming-transcription-service

# Logging Configuration
logging.level.root=INFO
logging.level.com.interview=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# WebFlux Configuration
spring.webflux.base-path=/api

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Gemini API Configuration
gemini.api.key=AIzaSyC53q8BrT4KGflz-tdkXOHwdei3HTiEXEM
gemini.api.url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-pro
gemini.streaming.enabled=true
gemini.max-retries=3
gemini.timeout-seconds=30

# Audio Processing Configuration
audio.chunk.max-size-mb=10
audio.supported-formats=audio/webm,audio/wav,audio/mp3,audio/ogg
audio.buffer.size=8192

# WebSocket Configuration
websocket.max-sessions=100
websocket.max-idle-timeout=300000
websocket.max-message-size=10485760

# Performance Configuration
spring.reactor.netty.pool.max-connections=500
spring.reactor.netty.pool.acquire-timeout=45000

# Health and Monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
